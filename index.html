<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nish - Install Top Apps Now</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            width: 90%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(99, 102, 241, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Animated loading spinner */
        .spinner {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 40px;
        }

        .spinner-circle {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-top-color: #6366f1;
            border-right-color: #3b82f6;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        .spinner-circle:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 10px;
            left: 10px;
            border-top-color: #3b82f6;
            border-right-color: transparent;
            animation: spin 1.5s linear infinite reverse;
        }

        .spinner-circle:nth-child(3) {
            width: 40px;
            height: 40px;
            top: 20px;
            left: 20px;
            border-top-color: #6366f1;
            border-right-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 2.2em;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 0.95em;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .status-text {
            font-size: 0.85em;
            color: #94a3b8;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #6366f1;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
            }
            50% {
                opacity: 0.7;
            }
            100% {
                box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
            }
        }

        /* Progress bar */
        .progress-container {
            margin-bottom: 28px;
        }

        .progress-bar {
            height: 3px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1 0%, #3b82f6 100%);
            animation: fillProgress 2s ease-in-out infinite;
            border-radius: 3px;
        }

        @keyframes fillProgress {
            0% {
                width: 0%;
            }
            50% {
                width: 85%;
            }
            100% {
                width: 100%;
            }
        }

        .cta-button {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 18px 32px; /* Enhanced button styling for better visibility */
            font-size: 1.05em; /* Enhanced button styling for better visibility */
            font-weight: 700; /* Enhanced button styling for better visibility */
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4); /* Enhanced button styling for better visibility */
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .features {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .feature {
            font-size: 0.85em;
        }

        .feature-icon {
            font-size: 1.8em;
            margin-bottom: 8px;
        }

        .feature-title {
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 4px;
        }

        .feature-text {
            color: #94a3b8;
            font-size: 0.8em;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 24px;
            }
            h1 {
                font-size: 1.8em;
            }
            .subtitle {
                font-size: 0.9em;
            }
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner">
            <div class="spinner-circle"></div>
            <div class="spinner-circle"></div>
            <div class="spinner-circle"></div>
        </div>

        <h1>Nish Install</h1>
        <p class="subtitle">Préparez vos applications préférées</p>

        <div class="status-text">
            <span class="status-dot"></span>
            Cliquez sur "Installer maintenant" pour commencer <!-- Updated status message to emphasize action -->
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <button class="cta-button" onclick="redirectToApp()">
            Installer maintenant
        </button>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">Rapide</div>
                <div class="feature-text">Installation ultra-rapide</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-title">Sécurisé</div>
                <div class="feature-text">Vérifiées et certifiées</div>
            </div>
        </div>
    </div>

    <script>
        function redirectToApp() {
            // Remplace par ton lien d'affiliation
            const affiliateLink = "https://play.google.com/store/apps/details?id=com.example.app&referrer=your_affiliate_id";
            window.location.href = affiliateLink;
        }
    </script>
</body>
</html>
